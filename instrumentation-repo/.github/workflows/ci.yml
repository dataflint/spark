name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Compile all modules
        run: sbt core/compile spark3/compile spark4/compile

      # The full instrumentation regression suite runs against Spark 3.5.
      - name: Test (Spark 3.x)
        run: sbt spark3/test
